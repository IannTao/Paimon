[package]
name = "paimon-probe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lowe-sift = { version = "0.2.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json_lenient = { version = "0.2.4", features = ["float_roundtrip"] }
sha2 = "0.11.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
